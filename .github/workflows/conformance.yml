# OpenID conformance suite (R10): a smoke subset on every PR, the full Basic OP and Config OP
# plans nightly and on release tags. A release needs the latest full run to be green.
name: Conformance
on:
  pull_request:
  push:
    tags: ['v*']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: conformance-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false # no Python lock file to key a cache on
      - name: Run the suite
        run: ./conformance/run.sh ${{ github.event_name == 'pull_request' && 'smoke' || 'full' }}
      - name: Upload exported results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: conformance-results
          path: conformance/results/export
      - if: always()
        run: ./conformance/run.sh down
