# The production image, built with BuildKit's GitHub Actions cache so unchanged layers (the Rust
# dependencies above all) are reused across runs. Pull requests build it only when something that
# goes into the image changes.
name: Image
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - backend/**
      - apps/web/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - .github/workflows/image.yml
permissions:
  contents: read
concurrency:
  group: image-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: handstamp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
