<!doctype html>
<html lang="en" data-theme="dark" data-product="handstamp">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Handstamp</title>
    <link rel="icon" type="image/svg+xml" href="/src/assets/brand/handstamp-favicon.svg" />
    <script>
      try {
        var t = localStorage.getItem('reciam-theme');
        document.documentElement.dataset.theme =
          t === 'light' || t === 'dark'
            ? t
            : t === 'system' && matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
